[project]
name = "email-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.154.0", "pydantic-settings>=2.10,<3", "uvicorn==0.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx>=0.28,<1", "ruff==0.17.1", "mypy==2.4.0"]
integration = ["psycopg[binary]==3.3.6", "neo4j==6.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: isolated application and configuration checks",
  "integration: real authenticated stores and persistence",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
